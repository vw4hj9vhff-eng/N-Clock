<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>N-Clock — Signage</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: transparent;
      overflow: hidden;
    }

    .stage {
      height: 100%;
      display: grid;
      place-items: center;
    }

    .clock {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
        "Liberation Mono", "Courier New", monospace;
      font-weight: 700;
      line-height: 1;
      letter-spacing: 0.03em;
      color: #fff;

      /* Big, signage-safe scaling */
      font-size: min(20vw, 24vh);

      user-select: none;
      will-change: transform;
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }

    .blinker {
      display: inline-block;
      width: 0.7ch;
      text-align: center;
      opacity: 1;
      transition: opacity 150ms linear;
    }

    .blinker.off {
      opacity: 0;
    }
  </style>
</head>

<body>
  <div class="stage">
    <div id="clock" class="clock" aria-label="Reykjavik time">
      <span id="hh">00</span><span id="c1" class="blinker">:</span>
      <span id="mm">00</span><span id="c2" class="blinker">:</span>
      <span id="ss">00</span>
    </div>
  </div>

  <script>
    const hh = document.getElementById("hh");
    const mm = document.getElementById("mm");
    const ss = document.getElementById("ss");
    const c1 = document.getElementById("c1");
    const c2 = document.getElementById("c2");
    const clock = document.getElementById("clock");

    const pad = n => String(n).padStart(2, "0");

    function tick() {
      const now = new Date();
      hh.textContent = pad(now.getUTCHours());
      mm.textContent = pad(now.getUTCMinutes());
      ss.textContent = pad(now.getUTCSeconds());

      const blink = now.getUTCSeconds() % 2 === 0;
      c1.classList.toggle("off", !blink);
      c2.classList.toggle("off", !blink);
    }

    /* Align tick exactly to system second */
    function startClock() {
      tick();
      const delay = 1000 - new Date().getMilliseconds();
      setTimeout(() => {
        tick();
        setInterval(tick, 1000);
      }, delay);
    }

    /* Ultra-subtle anti burn-in drift */
    let dx = 0, dy = 0;
    function drift() {
      dx += (Math.random() - 0.5) * 0.6;
      dy += (Math.random() - 0.5) * 0.6;
      dx = Math.max(-2, Math.min(2, dx));
      dy = Math.max(-2, Math.min(2, dy));
      clock.style.transform = `translate(${dx}px, ${dy}px)`;
    }

    startClock();
    setInterval(drift, 30000); // every 30 seconds
  </script>
</body>
</html>
