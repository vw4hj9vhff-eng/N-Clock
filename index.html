<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="height=device-width, initial-scale=1" />
  <title>N-Clock — Signage</title>

  <style>
    /* FIGURA — Bold */
    @font-face {
      font-family: "Figura";
      src: url("fonts/Figura-Bold.woff2") format("woff2");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 400%;
      margin: 0;
      background:transparent;
      overflow: hidden;
    }

    .stage {}

    .clock {
      font-family: "Figura", system-ui, sans-serif;
      font-weight: 700;
      line-height: 1;
      letter-spacing: 0.02em; /* tuned for Figura */
      color: #fff;
      

      /* Large, signage-safe scaling */
      font-size: min(36vw, 40vh);

      user-select: none;
      will-change: transform;
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }

    .blinker {
      display: inline-block;
      width: 0.8ch; /* slightly wider colon spacing for Figura */
      text-align: left;
      opacity: 1;
      transition: opacity 180ms linear;
    }

    .blinker.off {
      opacity: 0;
    }
  </style>
</head>

<body>
  <div class="stage">
    <div id="clock" class="clock" aria-label="Reykjavik time">
      <span id="hh">00</span><span id="colon" class="blinker">:</span><span id="mm">00</span>
    </div>
  </div>

  <script>
    const hh = document.getElementById("hh");
    const mm = document.getElementById("mm");
    const colon = document.getElementById("colon");
    const clock = document.getElementById("clock");

    const pad = n => String(n).padStart(2, "0");

    function tick() {
      const now = new Date();

      hh.textContent = pad(now.getUTCHours());
      mm.textContent = pad(now.getUTCMinutes());

      // Blink colon every second
      colon.classList.toggle("off", now.getUTCSeconds() % 2 !== 0);
    }

    function startClock() {
      tick();
      const delay = 1000 - new Date().getMilliseconds();
      setTimeout(() => {
        tick();
        setInterval(tick, 1000);
      }, delay);
    }

    /* Ultra-subtle anti burn-in drift (OLED safe) */
    let dx = 0, dy = 0;
    function drift() {
      dx += (Math.random() - 0.5) * 0.6;
      dy += (Math.random() - 0.5) * 0.6;
      dx = Math.max(-2, Math.min(2, dx));
      dy = Math.max(-2, Math.min(2, dy));
      clock.style.transform = `translate(${dx}px, ${dy}px)`;
    }

    startClock();
    setInterval(drift, 30000);
    
  
  </script>
  
</body>
</html>
